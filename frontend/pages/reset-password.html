<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password | Universal Attendance System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reset-container {
      max-width: 500px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 40px;
      margin: 20px;
    }
    h2 {
      font-weight: 700;
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }
    .form-label {
      font-weight: 500;
      color: #555;
    }
    .form-control {
      border-radius: 10px;
      border: 2px solid #e0e0e0;
      padding: 12px 16px;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
      outline: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      padding: 12px 40px;
      font-weight: 600;
      font-size: 1.1rem;
      border-radius: 30px;
      box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
      width: 100%;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
    }
    .alert {
      border-radius: 10px;
      border: none;
    }
    .password-strength {
      margin-top: 5px;
      font-size: 0.85rem;
    }
    .strength-weak { color: #dc3545; }
    .strength-medium { color: #ffc107; }
    .strength-strong { color: #28a745; }
    .requirements {
      font-size: 0.85rem;
      color: #6c757d;
      margin-top: 10px;
    }
    .requirement {
      display: flex;
      align-items: center;
      margin: 2px 0;
    }
    .requirement i {
      margin-right: 5px;
      width: 12px;
    }
    .requirement.met { color: #28a745; }
    .requirement.met i { color: #28a745; }
    .requirement:not(.met) { color: #dc3545; }
    .requirement:not(.met) i { color: #dc3545; }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="text-center mb-4">
      <i class="fas fa-key fa-4x text-primary mb-3"></i>
      <h2>Reset Your Password</h2>
      <p class="text-muted">Enter your new password below</p>
    </div>

    <div id="tokenStatus" class="alert d-none" role="alert"></div>

    <form id="resetPasswordForm">
      <div class="mb-3">
        <label for="newPassword" class="form-label">New Password</label>
        <div class="input-group">
          <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required minlength="6" />
          <button type="button" id="toggleNewPassword" class="btn btn-outline-secondary" aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div id="passwordStrength" class="password-strength d-none"></div>
        <div class="requirements">
          <div class="requirement" data-requirement="length">
            <i class="fas fa-times"></i> At least 6 characters
          </div>
          <div class="requirement" data-requirement="uppercase">
            <i class="fas fa-times"></i> One uppercase letter
          </div>
          <div class="requirement" data-requirement="lowercase">
            <i class="fas fa-times"></i> One lowercase letter
          </div>
          <div class="requirement" data-requirement="number">
            <i class="fas fa-times"></i> One number
          </div>
        </div>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label">Confirm New Password</label>
        <div class="input-group">
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required />
          <button type="button" id="toggleConfirmPassword" class="btn btn-outline-secondary" aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div id="confirmPasswordError" class="text-danger small d-none mt-1">
          Passwords do not match
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" id="resetBtn">
        <i class="fas fa-save me-2"></i>Reset Password
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="#" onclick="goBackToLogin()" class="text-decoration-none">
        <i class="fas fa-arrow-left me-2"></i>Back to Login
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Detect API base URL that works from any device
    const hostname = window.location.hostname;
    let API_BASE;

    if (hostname === 'localhost' || hostname === '127.0.0.1') {
      // For local development, use 127.0.0.1 for better compatibility
      API_BASE = 'http://127.0.0.1:4000';
    } else {
      // For network access, use the current hostname
      API_BASE = `http://${hostname}:4000`;
    }

    // Get token from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const resetToken = urlParams.get('token');

    if (!resetToken) {
      showStatus('Invalid or missing reset token. Please request a new password reset.', 'danger');
      document.getElementById('resetPasswordForm').style.display = 'none';
    } else {
      // Verify token validity
      verifyResetToken(resetToken);
    }

    // Verify reset token
    async function verifyResetToken(token) {
      try {
        const response = await fetch(`${API_BASE}/api/verify-reset-token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        const result = await response.json();

        if (result.success) {
          showStatus('Token verified successfully. You can now reset your password.', 'success');
        } else {
          showStatus(result.message || 'Invalid or expired reset token.', 'danger');
          document.getElementById('resetPasswordForm').style.display = 'none';
        }
      } catch (error) {
        console.error('Token verification error:', error);
        showStatus('Network error. Please try again.', 'danger');
        document.getElementById('resetPasswordForm').style.display = 'none';
      }
    }

    // Password strength checker
    document.getElementById('newPassword').addEventListener('input', function() {
      const password = this.value;
      const strengthDiv = document.getElementById('passwordStrength');
      const requirements = document.querySelectorAll('.requirement');

      // Check requirements
      const hasLength = password.length >= 6;
      const hasUppercase = /[A-Z]/.test(password);
      const hasLowercase = /[a-z]/.test(password);
      const hasNumber = /\d/.test(password);

      // Update requirement indicators
      updateRequirement('length', hasLength);
      updateRequirement('uppercase', hasUppercase);
      updateRequirement('lowercase', hasLowercase);
      updateRequirement('number', hasNumber);

      // Show strength
      if (password.length === 0) {
        strengthDiv.classList.add('d-none');
        return;
      }

      const strength = [hasLength, hasUppercase, hasLowercase, hasNumber].filter(Boolean).length;

      strengthDiv.classList.remove('d-none');
      if (strength <= 2) {
        strengthDiv.textContent = 'Weak password';
        strengthDiv.className = 'password-strength strength-weak';
      } else if (strength === 3) {
        strengthDiv.textContent = 'Medium password';
        strengthDiv.className = 'password-strength strength-medium';
      } else {
        strengthDiv.textContent = 'Strong password';
        strengthDiv.className = 'password-strength strength-strong';
      }
    });

    function updateRequirement(requirement, met) {
      const element = document.querySelector(`[data-requirement="${requirement}"]`);
      const icon = element.querySelector('i');

      if (met) {
        element.classList.add('met');
        icon.classList.remove('fa-times');
        icon.classList.add('fa-check');
      } else {
        element.classList.remove('met');
        icon.classList.remove('fa-check');
        icon.classList.add('fa-times');
      }
    }

    // Confirm password validation
    document.getElementById('confirmPassword').addEventListener('input', function() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = this.value;
      const errorDiv = document.getElementById('confirmPasswordError');

      if (newPassword && confirmPassword && newPassword !== confirmPassword) {
        errorDiv.classList.remove('d-none');
        this.classList.add('is-invalid');
      } else {
        errorDiv.classList.add('d-none');
        this.classList.remove('is-invalid');
      }
    });

    // Toggle password visibility
    document.getElementById('toggleNewPassword').addEventListener('click', function() {
      togglePassword('newPassword', 'toggleNewPassword');
    });

    document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
      togglePassword('confirmPassword', 'toggleConfirmPassword');
    });

    function togglePassword(inputId, buttonId) {
      const input = document.getElementById(inputId);
      const button = document.getElementById(buttonId);
      const icon = button.querySelector('i');

      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Form submission
    document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Validation
      if (!newPassword || !confirmPassword) {
        showStatus('Please fill in all fields.', 'warning');
        return;
      }

      if (newPassword.length < 6) {
        showStatus('Password must be at least 6 characters long.', 'warning');
        return;
      }

      if (newPassword !== confirmPassword) {
        showStatus('Passwords do not match.', 'warning');
        return;
      }

      // Check password strength
      const hasUppercase = /[A-Z]/.test(newPassword);
      const hasLowercase = /[a-z]/.test(newPassword);
      const hasNumber = /\d/.test(newPassword);

      if (!hasUppercase || !hasLowercase || !hasNumber) {
        showStatus('Password must contain at least one uppercase letter, one lowercase letter, and one number.', 'warning');
        return;
      }

      // Disable button and show loading
      const resetBtn = document.getElementById('resetBtn');
      const originalText = resetBtn.innerHTML;
      resetBtn.disabled = true;
      resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Resetting...';

      try {
        const response = await fetch(`${API_BASE}/api/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: resetToken,
            newPassword: newPassword
          })
        });

        const result = await response.json();

        if (result.success) {
          showStatus('Password reset successfully! Redirecting to login...', 'success');

          // Redirect to login after 3 seconds - use frontend URL if on backend
          setTimeout(() => {
            // If we're on backend server, redirect to frontend
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
              if (window.location.port === '4000') {
                // We're on backend, redirect to frontend
                window.location.href = 'http://127.0.0.1:5501/pages/register.html';
              } else {
                // We're already on frontend
                window.location.href = '/pages/register.html';
              }
            } else {
              // Network access, use current hostname with frontend port
              window.location.href = `http://${window.location.hostname}:5501/pages/register.html`;
            }
          }, 3000);
        } else {
          showStatus(result.message || 'Failed to reset password. Please try again.', 'danger');
          resetBtn.disabled = false;
          resetBtn.innerHTML = originalText;
        }
      } catch (error) {
        console.error('Reset password error:', error);
        showStatus('Network error. Please check your connection and try again.', 'danger');
        resetBtn.disabled = false;
        resetBtn.innerHTML = originalText;
      }
    });

    function showStatus(message, type) {
      const statusDiv = document.getElementById('tokenStatus');
      statusDiv.textContent = message;
      statusDiv.className = `alert alert-${type}`;
      statusDiv.classList.remove('d-none');
    }

    // Handle back to login navigation
    function goBackToLogin() {
      // If we're on backend server, redirect to frontend
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if (window.location.port === '4000') {
          // We're on backend, redirect to frontend
          window.location.href = 'http://127.0.0.1:5501/pages/register.html';
        } else {
          // We're already on frontend
          window.location.href = '/pages/register.html';
        }
      } else {
        // Network access, use current hostname with frontend port
        window.location.href = `http://${window.location.hostname}:5501/pages/register.html`;
      }
    }
  </script>
</body>
</html>
