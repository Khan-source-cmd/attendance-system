<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Faculty Classes - Universal Attendance System</title>
    <link href="/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/fontawesome.all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        
        .main-content {
            padding: 2rem 0;
        }
        
        .page-header {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.3);
        }
        
        .faculty-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3498db;
            transition: all 0.3s ease;
        }
        
        .faculty-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        
        .class-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #27ae60;
            transition: all 0.3s ease;
        }
        
        .class-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }
        
        .search-bar {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <!-- Main Content -->
    <div class="container main-content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1 class="mb-2"><i class="fas fa-chalkboard-teacher me-3"></i>Faculty Class Management</h1>
                    <p class="mb-0 opacity-75">Manage faculty members and assign classes to teachers</p>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-light btn-lg" onclick="refreshFaculty()">
                        <i class="fas fa-sync me-2"></i>Refresh
                    </button>
                </div>
            </div>
        </div>

        <!-- Search and Filter Bar -->
        <div class="search-bar">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" class="form-control" id="searchFaculty" placeholder="Search faculty by name...">
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="roleFilter">
                        <option value="">All Roles</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Professor">Professor</option>
                        <option value="Lecturer">Lecturer</option>
                        <option value="Instructor">Instructor</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="departmentFilter">
                        <option value="">All Departments</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Physics">Physics</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Chemistry">Chemistry</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="statusFilter">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" onclick="filterFaculty()">
                        <i class="fas fa-filter me-2"></i>Filter
                    </button>
                </div>
            </div>
        </div>

        <!-- Faculty List -->
        <div id="facultyList">
            <!-- Faculty cards will be dynamically populated here -->
        </div>
    </div>



    <!-- Class Assignment Modal -->
    <div class="modal fade" id="assignClassModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-plus me-2"></i>Assign Class</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="assignClassForm">
                        <input type="hidden" id="assignFacultyId">
                        <div class="mb-3">
                            <label class="form-label">Available Classes</label>
                            <select class="form-select" id="availableClasses" required>
                                <option value="">Select a class to assign</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="assignClass()">
                        <i class="fas fa-check me-2"></i>Assign Class
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>window.PAGE_GUARD_REQUIRE = 'education-admin';</script>
    <script src="/js/page-guard.js"></script>

    <script>
        const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:4000' : '';
        
        function getAuthToken() {
            return localStorage.getItem('token') || sessionStorage.getItem('token');
        }

        let facultyData = [];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadFaculty();
            loadAvailableClasses();
        });

        // Load faculty data - get users with faculty roles
        async function loadFaculty() {
            try {
                const token = getAuthToken();
                // Get all users and filter for faculty roles on frontend
                const response = await fetch(`${API_BASE}/api/admin/users?active_only=true`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        // Filter for faculty roles and transform user data to faculty format
                        const facultyRoles = ['Teacher', 'Professor', 'Lecturer', 'Instructor', 'Assistant Professor'];
                        facultyData = result.users
                            .filter(user => facultyRoles.includes(user.role))
                            .map(user => ({
                                id: user.digital_id,
                                name: user.name,
                                email: user.email,
                                department: user.profile_data?.department || 'Not Assigned',
                                phone: user.phone || '',
                                employeeId: user.digital_id,
                                status: user.is_active ? 'active' : 'inactive',
                                role: user.role,
                                classes: [] // Will be populated from assignments
                            }));

                        // Load class assignments for each faculty member
                        await loadFacultyClassAssignments();
                    } else {
                        facultyData = [];
                        showNotification('No faculty members found in your organization', 'info');
                    }
                } else {
                    facultyData = [];
                    showNotification('Failed to load faculty data', 'error');
                }

                renderFaculty(facultyData);
            } catch (error) {
                console.error('Error loading faculty:', error);
                facultyData = [];
                renderFaculty(facultyData);
                showNotification('Error loading faculty data', 'error');
            }
        }

        // Load class assignments for faculty members
        async function loadFacultyClassAssignments() {
            try {
                const token = getAuthToken();

                // Load class assignments for each faculty member
                for (let faculty of facultyData) {
                    try {
                        const response = await fetch(`${API_BASE}/api/faculty/${faculty.id}/classes`, {
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            }
                        });

                        if (response.ok) {
                            const result = await response.json();
                            if (result.success && result.classes) {
                                faculty.classes = result.classes.map(cls => ({
                                    id: cls.id,
                                    name: cls.class_name || cls.name,
                                    students: cls.student_count || 0
                                }));
                            }
                        }
                    } catch (classError) {
                        console.warn(`Failed to load classes for faculty ${faculty.id}:`, classError);
                        faculty.classes = [];
                    }
                }
            } catch (error) {
                console.error('Error loading faculty class assignments:', error);
            }
        }



        // Render faculty cards
        function renderFaculty(data) {
            const container = document.getElementById('facultyList');
            
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-users fa-3x text-muted mb-3"></i>
                        <h5 class="text-muted">No faculty members found</h5>
                    </div>
                `;
                return;
            }

            const html = data.map(faculty => `
                <div class="faculty-card">
                    <div class="row align-items-center">
                        <div class="col-md-3">
                            <div class="d-flex align-items-center">
                                <div class="avatar-circle me-3">
                                    <i class="fas fa-user-tie fa-2x text-primary"></i>
                                </div>
                                <div>
                                    <h5 class="mb-1">${faculty.name}</h5>
                                    <p class="text-muted mb-0">${faculty.employeeId}</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <small class="text-muted">Department</small>
                            <p class="mb-1 fw-bold">${faculty.department}</p>
                            <small class="text-muted">${faculty.email}</small>
                        </div>
                        <div class="col-md-2">
                            <small class="text-muted">Classes</small>
                            <p class="mb-0"><span class="badge bg-primary">${faculty.classes.length}</span></p>
                        </div>
                        <div class="col-md-2">
                            <small class="text-muted">Status</small>
                            <p class="mb-0">
                                <span class="badge ${faculty.status === 'active' ? 'bg-success' : 'bg-danger'}">
                                    ${faculty.status}
                                </span>
                            </p>
                        </div>
                        <div class="col-md-2 text-end">
                            <div class="btn-group">
                                <button class="btn btn-outline-primary btn-sm" onclick="viewFacultyClasses('${faculty.id}')">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-outline-success btn-sm" onclick="showAssignClass('${faculty.id}')">
                                    <i class="fas fa-plus"></i>
                                </button>
                                <button class="btn btn-outline-warning btn-sm" onclick="editFaculty('${faculty.id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    ${faculty.classes.length > 0 ? `
                        <div class="mt-3">
                            <h6 class="mb-2">Assigned Classes:</h6>
                            <div class="row">
                                ${faculty.classes.map(cls => `
                                    <div class="col-md-6">
                                        <div class="class-item">
                                            <div class="d-flex justify-content-between align-items-center">
                                                <div>
                                                    <h6 class="mb-1">${cls.name}</h6>
                                                    <small class="text-muted">${cls.id} • ${cls.students} students</small>
                                                </div>
                                                <button class="btn btn-outline-danger btn-sm" onclick="unassignClass('${faculty.id}', '${cls.id}')">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `).join('');

            container.innerHTML = html;
        }

        // Filter faculty
        function filterFaculty() {
            const searchTerm = document.getElementById('searchFaculty').value.toLowerCase();
            const roleFilter = document.getElementById('roleFilter').value;
            const departmentFilter = document.getElementById('departmentFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            const filtered = facultyData.filter(faculty => {
                const matchesSearch = faculty.name.toLowerCase().includes(searchTerm) ||
                                    faculty.email.toLowerCase().includes(searchTerm) ||
                                    faculty.employeeId.toLowerCase().includes(searchTerm);

                const matchesRole = !roleFilter || faculty.role === roleFilter;
                const matchesDepartment = !departmentFilter || faculty.department === departmentFilter;
                const matchesStatus = !statusFilter || faculty.status === statusFilter;

                return matchesSearch && matchesRole && matchesDepartment && matchesStatus;
            });

            renderFaculty(filtered);
        }

        // Add event listeners for real-time filtering
        document.getElementById('searchFaculty').addEventListener('input', filterFaculty);
        document.getElementById('roleFilter').addEventListener('change', filterFaculty);
        document.getElementById('departmentFilter').addEventListener('change', filterFaculty);
        document.getElementById('statusFilter').addEventListener('change', filterFaculty);

        // Refresh faculty data
        function refreshFaculty() {
            loadFaculty();
            // Show loading indicator
            const btn = event.target.closest('button');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Refreshing...';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }, 1000);
        }

        // Show assign class modal
        function showAssignClass(facultyId) {
            document.getElementById('assignFacultyId').value = facultyId;
            new bootstrap.Modal(document.getElementById('assignClassModal')).show();
        }

        // Load available classes
        async function loadAvailableClasses() {
            try {
                const token = getAuthToken();
                const response = await fetch(`${API_BASE}/api/admin/classes?active_only=true`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const select = document.getElementById('availableClasses');
                select.innerHTML = '<option value="">Loading classes...</option>';

                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.classes) {
                        select.innerHTML = '<option value="">Select a class to assign</option>' +
                            result.classes.map(cls => `<option value="${cls.id}">${cls.name} (${cls.subject})</option>`).join('');
                    } else {
                        select.innerHTML = '<option value="">No classes available</option>';
                    }
                } else {
                    select.innerHTML = '<option value="">Error loading classes</option>';
                }
            } catch (error) {
                console.error('Error loading available classes:', error);
                const select = document.getElementById('availableClasses');
                select.innerHTML = '<option value="">Error loading classes</option>';
            }
        }

        // Assign class to faculty
        function assignClass() {
            const facultyId = document.getElementById('assignFacultyId').value;
            const classId = document.getElementById('availableClasses').value;
            
            if (!classId) {
                alert('Please select a class to assign.');
                return;
            }

            // Here you would typically send the assignment to your backend
            console.log('Assigning class:', classId, 'to faculty:', facultyId);
            
            alert('Class assigned successfully!');
            bootstrap.Modal.getInstance(document.getElementById('assignClassModal')).hide();
            loadFaculty();
        }

        // View faculty classes
        function viewFacultyClasses(facultyId) {
            const faculty = facultyData.find(f => f.id === facultyId);
            if (faculty) {
                alert(`Faculty: ${faculty.name}\nClasses: ${faculty.classes.map(c => c.name).join(', ')}`);
            }
        }

        // Edit faculty - manage roles and departments
        function editFaculty(facultyId) {
            const faculty = facultyData.find(f => f.id === facultyId);
            if (!faculty) {
                alert('Faculty member not found.');
                return;
            }

            // Create edit modal dynamically
            const modalHtml = `
                <div class="modal fade" id="editFacultyModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title"><i class="fas fa-edit me-2"></i>Edit Faculty Member</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="editFacultyForm">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label">Full Name</label>
                                            <input type="text" class="form-control" name="name" value="${faculty.name}" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Email Address</label>
                                            <input type="email" class="form-control" name="email" value="${faculty.email}" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Role</label>
                                            <select class="form-select" name="role" required>
                                                <option value="Teacher" ${faculty.role === 'Teacher' ? 'selected' : ''}>Teacher</option>
                                                <option value="Professor" ${faculty.role === 'Professor' ? 'selected' : ''}>Professor</option>
                                                <option value="Lecturer" ${faculty.role === 'Lecturer' ? 'selected' : ''}>Lecturer</option>
                                                <option value="Instructor" ${faculty.role === 'Instructor' ? 'selected' : ''}>Instructor</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Department</label>
                                            <select class="form-select" name="department" required>
                                                <option value="">Select Department</option>
                                                <option value="Computer Science" ${faculty.department === 'Computer Science' ? 'selected' : ''}>Computer Science</option>
                                                <option value="Mathematics" ${faculty.department === 'Mathematics' ? 'selected' : ''}>Mathematics</option>
                                                <option value="Physics" ${faculty.department === 'Physics' ? 'selected' : ''}>Physics</option>
                                                <option value="Engineering" ${faculty.department === 'Engineering' ? 'selected' : ''}>Engineering</option>
                                                <option value="Chemistry" ${faculty.department === 'Chemistry' ? 'selected' : ''}>Chemistry</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Phone Number</label>
                                            <input type="tel" class="form-control" name="phone" value="${faculty.phone}">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Status</label>
                                            <select class="form-select" name="status">
                                                <option value="active" ${faculty.status === 'active' ? 'selected' : ''}>Active</option>
                                                <option value="inactive" ${faculty.status === 'inactive' ? 'selected' : ''}>Inactive</option>
                                            </select>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-primary" onclick="updateFaculty('${facultyId}')">
                                    <i class="fas fa-save me-2"></i>Update Faculty
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Remove existing modal if present
            const existingModal = document.getElementById('editFacultyModal');
            if (existingModal) {
                existingModal.remove();
            }

            // Add modal to body and show it
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            new bootstrap.Modal(document.getElementById('editFacultyModal')).show();
        }

        // Update faculty member
        async function updateFaculty(facultyId) {
            const form = document.getElementById('editFacultyForm');
            const formData = new FormData(form);

            const updateData = {
                name: formData.get('name').trim(),
                email: formData.get('email').trim(),
                role: formData.get('role'),
                department: formData.get('department'),
                phone: formData.get('phone').trim(),
                status: formData.get('status') === 'active' ? 1 : 0
            };

            // Basic validation
            if (!updateData.name || !updateData.email || !updateData.role || !updateData.department) {
                alert('Please fill in all required fields.');
                return;
            }

            try {
                const token = getAuthToken();
                const response = await fetch(`${API_BASE}/api/admin/users/${facultyId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });

                if (response.ok) {
                    alert('Faculty member updated successfully!');
                    bootstrap.Modal.getInstance(document.getElementById('editFacultyModal')).hide();
                    loadFaculty(); // Refresh the list
                } else {
                    const result = await response.json();
                    alert(result.message || 'Failed to update faculty member.');
                }
            } catch (error) {
                console.error('Error updating faculty:', error);
                alert('Network error. Please try again.');
            }
        }

        // Unassign class from faculty
        function unassignClass(facultyId, classId) {
            if (confirm('Are you sure you want to unassign this class?')) {
                console.log('Unassigning class:', classId, 'from faculty:', facultyId);
                alert('Class unassigned successfully!');
                loadFaculty();
            }
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = '/pages/register.html';
            }
        }
    </script>
</body>
</html>
