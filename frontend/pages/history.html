<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance History - Universal Attendance System</title>
    <link href="/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/fontawesome.all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        
        .main-content {
            padding: 2rem 0;
        }
        
        .page-header {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.3);
        }
        
        .history-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3498db;
        }
        
        .record-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #27ae60;
            transition: all 0.3s ease;
        }
        
        .record-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .record-item.punch-out {
            border-left-color: #e74c3c;
        }
        
        .record-item.punch-break-start {
            border-left-color: #f39c12;
        }
        
        .record-item.punch-break-end {
            border-left-color: #9b59b6;
        }
        
        .filter-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
        
        .stats-row {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .stat-box {
            text-align: center;
            padding: 1rem;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            color: #7f8c8d;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #ecf0f1;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }
        
        .badge {
            padding: 0.5rem 0.75rem;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .method-icon {
            width: 40px;
            height: 40px;
            background: #f8f9fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <!-- Main Content -->
    <div class="container main-content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1 class="mb-2"><i class="fas fa-history me-3"></i>Attendance History</h1>
                    <p class="mb-0 opacity-75">View and analyze your attendance records</p>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-light btn-lg" onclick="exportHistory()">
                        <i class="fas fa-download me-2"></i>Export Data
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="stats-row">
            <div class="row">
                <div class="col-md-3">
                    <div class="stat-box">
                        <div class="stat-number text-primary" id="totalRecords">-</div>
                        <div class="stat-label">Total Records</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-box">
                        <div class="stat-number text-success" id="thisMonth">-</div>
                        <div class="stat-label">This Month</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-box">
                        <div class="stat-number text-info" id="averageHours">-</div>
                        <div class="stat-label">Avg Hours/Day</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-box">
                        <div class="stat-number text-warning" id="currentStreak">-</div>
                        <div class="stat-label">Current Streak</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-card">
            <h5 class="mb-3"><i class="fas fa-filter me-2"></i>Filter Records</h5>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">From Date</label>
                    <input type="date" class="form-control" id="fromDate">
                </div>
                <div class="col-md-3">
                    <label class="form-label">To Date</label>
                    <input type="date" class="form-control" id="toDate">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Punch Type</label>
                    <select class="form-select" id="punchTypeFilter">
                        <option value="">All Types</option>
                        <option value="in">Punch In</option>
                        <option value="out">Punch Out</option>
                        <option value="break_start">Start Break</option>
                        <option value="break_end">End Break</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Method</label>
                    <select class="form-select" id="methodFilter">
                        <option value="">All Methods</option>
                        <option value="manual">Manual</option>
                        <option value="gps">GPS</option>
                        <option value="qr">QR Code</option>
                    </select>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-9">
                    <input type="text" class="form-control" id="searchRecords" placeholder="Search notes or locations...">
                </div>
                <div class="col-md-3">
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary flex-grow-1" onclick="filterRecords()">
                            <i class="fas fa-search me-2"></i>Filter
                        </button>
                        <button class="btn btn-outline-secondary" onclick="clearFilters()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Records -->
        <div class="history-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5><i class="fas fa-list me-2"></i>Recent Records</h5>
                <div class="d-flex gap-2">
                    <select class="form-select form-select-sm" id="recordsPerPage" onchange="changeRecordsPerPage()">
                        <option value="10">10 per page</option>
                        <option value="25" selected>25 per page</option>
                        <option value="50">50 per page</option>
                        <option value="100">100 per page</option>
                    </select>
                </div>
            </div>
            
            <div id="historyList">
                <!-- Records will be populated here -->
                <div class="text-center py-4">
                    <i class="fas fa-spinner fa-spin fa-2x text-muted mb-3"></i>
                    <p class="text-muted">Loading attendance records...</p>
                </div>
            </div>

            <!-- Pagination -->
            <nav aria-label="History pagination" class="mt-4">
                <ul class="pagination justify-content-center" id="historyPagination">
                    <!-- Pagination will be populated here -->
                </ul>
            </nav>
        </div>
    </div>

    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/navigation-fix.js"></script>
    <script src="/js/industry-theme.js"></script>
    <script>
        const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:4000' : '';

        function getAuthToken() {
            return localStorage.getItem('token') || sessionStorage.getItem('token');
        }

        let historyData = [];
        let filteredData = [];
        let currentPage = 1;
        let recordsPerPage = 25;

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadUserProfile();
            loadAttendanceHistory();
            setDefaultDates();
        });

        // Set default date range (last 30 days)
        function setDefaultDates() {
            const today = new Date();
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(today.getDate() - 30);
            
            document.getElementById('toDate').value = today.toISOString().split('T')[0];
            document.getElementById('fromDate').value = thirtyDaysAgo.toISOString().split('T')[0];
        }

        // Load user profile
        async function loadUserProfile() {
            try {
                const token = getAuthToken();
                const response = await fetch(`${API_BASE}/api/profile`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        document.getElementById('navUserName').textContent = result.user.name.split(' ')[0];
                    }
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        // Load attendance history
        async function loadAttendanceHistory() {
            try {
                const token = getAuthToken();
                const response = await fetch(`${API_BASE}/api/attendance/history?limit=1000`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        historyData = result.history;
                        // Filter out non-punch records on initial load
                        filteredData = historyData.filter(record => {
                            const recordPunchType = record.punchtype || record.punch_type;
                            return ['in', 'out', 'break_start', 'break_end', 'breakstart', 'breakend'].includes(recordPunchType);
                        });
                        updateStats();
                        renderHistory();
                    } else {
                        throw new Error(result.message);
                    }
                } else {
                    throw new Error('Failed to load history');
                }
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('historyList').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle fa-3x mb-3 text-warning"></i>
                        <h5>Failed to load history</h5>
                        <p>Please check your connection and try again.</p>
                        <button class="btn btn-primary" onclick="loadAttendanceHistory()">Retry</button>
                    </div>
                `;
            }
        }

        // Demo history data generator REMOVED - it fabricated attendance
        // records with random GPS coordinates, which is never acceptable.

        // Update statistics
        function updateStats() {
            // Filter out login/session records and only count actual punch records
            const punchRecords = filteredData.filter(record => {
                const punchType = record.punchtype || record.punch_type;
                return ['in', 'out', 'break_start', 'break_end', 'breakstart', 'breakend'].includes(punchType);
            });

            const totalRecords = punchRecords.length;

            // This month records (only punch records)
            const thisMonth = punchRecords.filter(record => {
                const date = new Date(record.timestamp);
                const now = new Date();
                return date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();
            }).length;
            
            // Calculate average hours per day
            const dailyRecords = {};
            filteredData.forEach(record => {
                const date = record.timestamp.split('T')[0];
                if (!dailyRecords[date]) {
                    dailyRecords[date] = [];
                }
                dailyRecords[date].push(record);
            });
            
            let totalHours = 0;
            let workingDays = 0;
            
            Object.entries(dailyRecords).forEach(([date, records]) => {
                const inRecord = records.find(r => r.punchtype === 'in');
                const outRecord = records.find(r => r.punchtype === 'out');
                
                if (inRecord && outRecord) {
                    const inTime = new Date(inRecord.timestamp);
                    const outTime = new Date(outRecord.timestamp);
                    const hours = (outTime - inTime) / (1000 * 60 * 60);
                    
                    if (hours > 0 && hours < 24) {
                        totalHours += hours;
                        workingDays++;
                    }
                }
            });
            
            const averageHours = workingDays > 0 ? (totalHours / workingDays).toFixed(1) : 0;
            
            // Calculate current streak
            const sortedDates = Object.keys(dailyRecords).sort().reverse();
            let streak = 0;
            const today = new Date().toISOString().split('T')[0];
            
            for (let i = 0; i < sortedDates.length; i++) {
                const date = sortedDates[i];
                const daysDiff = Math.floor((new Date(today) - new Date(date)) / (1000 * 60 * 60 * 24));
                
                if (daysDiff === streak && dailyRecords[date].some(r => r.punchtype === 'in')) {
                    streak++;
                } else {
                    break;
                }
            }
            
            // Update UI
            document.getElementById('totalRecords').textContent = totalRecords;
            document.getElementById('thisMonth').textContent = thisMonth;
            document.getElementById('averageHours').textContent = averageHours + 'h';
            document.getElementById('currentStreak').textContent = streak;
        }

        // Render history records
        function renderHistory() {
            const container = document.getElementById('historyList');
            const startIndex = (currentPage - 1) * recordsPerPage;
            const endIndex = startIndex + recordsPerPage;
            const pageData = filteredData.slice(startIndex, endIndex);
            
            if (pageData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-times fa-3x mb-3"></i>
                        <h5>No records found</h5>
                        <p>Try adjusting your filters or date range.</p>
                    </div>
                `;
                updatePagination(0);
                return;
            }
            
            const html = pageData.map(record => {
                const date = new Date(record.timestamp);
                const timeString = date.toLocaleString();
                const dateString = date.toLocaleDateString();
                const timeOnly = date.toLocaleTimeString();

                const punchType = record.punchtype || record.punch_type || 'unknown';
                const methodIcon = getMethodIcon(record.attendancemethod || record.attendance_method);
                const typeClass = `punch-${punchType.replace('_', '-')}`;
                const typeBadge = getPunchTypeBadge(punchType);
                const locationText = getLocationText(record.locationdata || record.location_data);
                
                return `
                    <div class="record-item ${typeClass}">
                        <div class="row align-items-center">
                            <div class="col-md-1">
                                <div class="method-icon">
                                    <i class="fas fa-${methodIcon} text-primary"></i>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="fw-bold">${dateString}</div>
                                <small class="text-muted">${timeOnly}</small>
                            </div>
                            <div class="col-md-2">
                                ${typeBadge}
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted">Method</small>
                                <div class="fw-bold text-capitalize">${record.attendancemethod}</div>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted">Location</small>
                                <div class="small">${locationText}</div>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted">Notes</small>
                                <div class="small">${record.notes || 'No notes'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = html;
            updatePagination(filteredData.length);
        }

        // Get method icon
        function getMethodIcon(method) {
            const icons = {
                'manual': 'hand-point-up',
                'gps': 'map-marker-alt',
                'qr': 'qrcode',
                'biometric': 'fingerprint'
            };
            return icons[method] || 'clock';
        }

        // Get punch type badge
        function getPunchTypeBadge(type) {
            const badges = {
                'in': '<span class="badge bg-success">Punch In</span>',
                'out': '<span class="badge bg-danger">Punch Out</span>',
                'break_start': '<span class="badge bg-warning">Start Break</span>',
                'break_end': '<span class="badge bg-info">End Break</span>',
                'breakstart': '<span class="badge bg-warning">Start Break</span>',
                'breakend': '<span class="badge bg-info">End Break</span>'
            };
            return badges[type] || '<span class="badge bg-secondary">Unknown</span>';
        }

        // Get location text
        function getLocationText(locationData) {
            if (!locationData) return 'Not available';
            
            try {
                const data = typeof locationData === 'string' ? JSON.parse(locationData) : locationData;
                if (data.qrlocation) return data.qrlocation;
                if (data.latitude && data.longitude) {
                    return `${data.latitude.toFixed(4)}, ${data.longitude.toFixed(4)}`;
                }
                return 'Unknown location';
            } catch (error) {
                return 'Invalid location data';
            }
        }

        // Update pagination
        function updatePagination(totalRecords) {
            const totalPages = Math.ceil(totalRecords / recordsPerPage);
            const pagination = document.getElementById('historyPagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let html = '';
            
            // Previous button
            if (currentPage > 1) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="changePage(${currentPage - 1})">Previous</a></li>`;
            }
            
            // Page numbers
            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
                const activeClass = i === currentPage ? 'active' : '';
                html += `<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="changePage(${i})">${i}</a></li>`;
            }
            
            // Next button
            if (currentPage < totalPages) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="changePage(${currentPage + 1})">Next</a></li>`;
            }
            
            pagination.innerHTML = html;
        }

        // Change page
        function changePage(page) {
            currentPage = page;
            renderHistory();
        }

        // Change records per page
        function changeRecordsPerPage() {
            recordsPerPage = parseInt(document.getElementById('recordsPerPage').value);
            currentPage = 1;
            renderHistory();
        }

        // Filter records
        function filterRecords() {
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;
            const punchType = document.getElementById('punchTypeFilter').value;
            const method = document.getElementById('methodFilter').value;
            const searchTerm = document.getElementById('searchRecords').value.toLowerCase();

            // First filter out non-punch records (login/session/audit records)
            const punchOnlyData = historyData.filter(record => {
                const recordPunchType = record.punchtype || record.punch_type;
                return ['in', 'out', 'break_start', 'break_end', 'breakstart', 'breakend'].includes(recordPunchType);
            });

            // Then apply user filters
            filteredData = punchOnlyData.filter(record => {
                const recordDate = new Date(record.timestamp).toISOString().split('T')[0];

                // Date filter
                if (fromDate && recordDate < fromDate) return false;
                if (toDate && recordDate > toDate) return false;

                // Punch type filter
                if (punchType && record.punchtype !== punchType) return false;

                // Method filter
                if (method && record.attendancemethod !== method) return false;

                // Search filter
                if (searchTerm) {
                    const notes = (record.notes || '').toLowerCase();
                    const location = getLocationText(record.locationdata).toLowerCase();
                    if (!notes.includes(searchTerm) && !location.includes(searchTerm)) return false;
                }

                return true;
            });

            currentPage = 1;
            updateStats();
            renderHistory();
        }

        // Clear filters
        function clearFilters() {
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            document.getElementById('punchTypeFilter').value = '';
            document.getElementById('methodFilter').value = '';
            document.getElementById('searchRecords').value = '';

            // Filter out non-punch records when clearing filters
            filteredData = historyData.filter(record => {
                const recordPunchType = record.punchtype || record.punch_type;
                return ['in', 'out', 'break_start', 'break_end', 'breakstart', 'breakend'].includes(recordPunchType);
            });

            currentPage = 1;
            updateStats();
            renderHistory();
            setDefaultDates();
        }

        // Export history
        function exportHistory() {
            if (filteredData.length === 0) {
                showNotification('No data to export', 'warning');
                return;
            }
            
            const headers = ['Date', 'Time', 'Type', 'Method', 'Location', 'Notes'];
            const csvData = filteredData.map(record => {
                const date = new Date(record.timestamp);
                return [
                    date.toLocaleDateString(),
                    date.toLocaleTimeString(),
                    record.punchtype,
                    record.attendancemethod,
                    getLocationText(record.locationdata),
                    record.notes || ''
                ];
            });
            
            const csvContent = [headers, ...csvData].map(row => row.join(',')).join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `attendance_history_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            
            window.URL.revokeObjectURL(url);
            showNotification('History exported successfully!', 'success');
        }

        // Show notification
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `alert alert-${type === 'error' ? 'danger' : type} alert-dismissible fade show position-fixed`;
            notification.style.cssText = 'top: 20px; right: 20px; z-index: 9999; max-width: 400px;';
            notification.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 5000);
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = '/pages/register.html';
            }
        }

        // Add event listeners for real-time filtering
        ['fromDate', 'toDate', 'punchTypeFilter', 'methodFilter'].forEach(id => {
            document.getElementById(id).addEventListener('change', filterRecords);
        });
        
        document.getElementById('searchRecords').addEventListener('input', debounce(filterRecords, 300));

        // Debounce function for search
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
</html>
